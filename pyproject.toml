[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "morocco-car-price"
version = "1.0.0"
description = "Machine Learning pipeline for predicting used car prices in Morocco (Marché Auto Maroc)"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    {name = "Achraf Mentagui & Rihab El Marikh"}
]
dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",
    "lightgbm>=4.0.0",
    "xgboost>=2.0.0",
    "catboost>=1.2.0",
    "joblib>=1.3.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0.0",
    "streamlit>=1.30.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
    "mlflow>=2.10.0",
]

[tool.ruff]
line-length = 120
target-version = "py310"
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "notebooks",
    "*.ipynb",
    "data",
    ".backup*",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort (import sorting)
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "BLE", # flake8-blind-except
    "S",   # flake8-bandit
    "RUF", # Ruff-specific rules
]
ignore = [
    "S101",   # Use of assert detected (needed in tests/ML sanity assertions)
    "E501",   # Line length handled gracefully for UI HTML templates & markdown
    "RUF001", # Ambiguous characters (emojis and French accents in UI/CLI)
    "RUF002", # Ambiguous docstring characters
    "RUF003", # Ambiguous comment characters
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "BLE001"]
"app/*" = ["S110", "BLE001"]
"scripts/*" = ["S101", "BLE001"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]


